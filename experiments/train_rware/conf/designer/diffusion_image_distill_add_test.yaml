defaults:
  - _self_
  - model: cnn

kind: diffusion
environment_repeats: 1
# Value
representation: image
n_update_iterations: 2
train_batch_size: 4
buffer_size: 128
weight_decay: 0.0
lr: 3e-5
distill_enable: true
distill_samples: 1
distill_hint: false
distill_synthetic_ratio: 0.0
random_generation_early_start: 0
loss_criterion: mse
train_early_start: 0
diffusion:
  disable_pug: true
